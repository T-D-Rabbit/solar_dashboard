<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Dashboard for Solar Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="border-wrap">
    <div class="box">
      <h1>Web Dashboard for Solar Panel</h1>
      <div class="stats">
        <p>Robot Status<span>Active</span></p>
        <p>Battery<span>90%</span></p>
        <p>Cleaning Status<span>Cleaning</span></p>
        <p>Location<span>Row=2, Panel=10</span></p>
        <p>Panels Inspected<span>10</span></p>
        <p>Cleaned Panels<span>7</span></p>
        <p>Dusty Panels<span>3</span></p>
        <p>Defective Panels<span>1</span></p>
      </div>

      <hr class="divider">

      <div class="lower-section">
        <div class="map-col" id="mapCol">
          <h2>Solar farm map</h2>
          <div class="map-box" id="mapBox">
            <div class="panel-grid">
              <button class="Cleaned" onclick="showDetails(1)">P1</button>
              <button class="Cleaned" onclick="showDetails(2)">P2</button>
              <button class="Dusty" onclick="showDetails(3)">P3</button>
              <button class="Cleaned" onclick="showDetails(4)">P4</button>
              <button class="Dusty" onclick="showDetails(5)">P5</button>
              <button class="Cleaned" onclick="showDetails(6)">P6</button>
              <button class="Cleaned" onclick="showDetails(7)">P7</button>
              <button class="Defective" onclick="showDetails(8)">P8</button>
              <button class="Cleaned" onclick="showDetails(9)">P9</button>
              <button class="Cleaned" onclick="showDetails(10)">P10</button>
            </div>
            <div class="details-wrap">
              <div id="panelDetails"></div>
              <button id="cleanDetails" onclick="return false;">Clean</button>
              <button id="clearDetails" onclick="clearDetails()">Clear</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="code.js"></script>
</body>
</html>
